services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: money
      POSTGRES_PASSWORD: money
      POSTGRES_DB: money_tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U money -d money_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://money:money@db:5432/money_tracker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"

volumes:
  pgdata:
